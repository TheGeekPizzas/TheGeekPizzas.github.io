<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>You are an idiot!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      overflow-x: hidden;
    }
    ruffle-player {
      display: block;
      width: 100%;
      height: 101vh;
    }
  </style>
</head>
<body>
  <script src="ruffle/ruffle.js"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath: "ruffle/",
      quality: "low"
    };

    window.addEventListener("load", () => {
      const player = window.RufflePlayer.newest().createPlayer();
      document.body.appendChild(player);
      player.load("youare.swf");

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          player.pause();
        } else {
          player.play();
        }
      });

      // Evita que Ruffle se robe el teclado tras hacer clic para activar el audio
      document.addEventListener("click", () => {
        setTimeout(() => {
          if (document.activeElement) {
            document.activeElement.blur();
          }
          window.focus();
        }, 50);
      });
    });

    // Intercepción limpia basada en tu archivo (sin pop-ups ni bloqueo de salida)
    window.addEventListener("keydown", function(event) {
      var keyCode = event.keyCode || event.which;

      // Bloquea F12 (123) y herramientas de desarrollo (Ctrl+Shift+I/J/C, Ctrl+U)
      if (keyCode == 123 || ((event.ctrlKey || event.metaKey) && event.shiftKey && (keyCode == 73 || keyCode == 74 || keyCode == 67)) || ((event.ctrlKey || event.metaKey) && keyCode == 85)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        return false;
      }

      // Intercepta Ctrl + S antes de descargar y muestra el título de la pestaña
      if ((event.ctrlKey || event.metaKey) && keyCode == 83) {
        event.preventDefault();
        event.stopImmediatePropagation();
        alert(document.title);
        return false;
      }

      // Intercepta Ctrl (17), Alt (18), Supr/Delete (46) y F4 (115) igual que en tu script
      if (keyCode == 17 || keyCode == 18 || keyCode == 46 || keyCode == 115) {
        event.preventDefault();
        event.stopImmediatePropagation();
        alert(document.title);
        return false;
      }
    }, true);
  </script>
</body>
</html>
